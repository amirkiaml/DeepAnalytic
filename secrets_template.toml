# Template for Streamlit secrets.
#
# Local:  save as .streamlit/secrets.toml  (add to .gitignore)
# Deploy: paste into Settings > Secrets in Streamlit Community Cloud
#
# Never commit the filled-in version.

OPENAI_API_KEY = "sk-..."
PINECONE_API_KEY = "..."
COHERE_API_KEY = "..."
PINECONE_INDEX_NAME = "sep-articles-intros-added"

# The full-corpus namespace. rag_pipeline.py currently connects to the
# default namespace, so this needs wiring in before the pilot goes out.
PINECONE_NAMESPACE = "articles-full"

# Salt for hashing emails into pseudonymous IDs. Any random string.
# Changing it breaks the link between old and new log entries.
ID_SALT = "change-me-to-something-random"

# --- Interaction logging -------------------------------------------
# Set false to switch logging off without redeploying.
LOGGING_ENABLED = true

# Google Sheet ID, the long string in the sheet's URL between /d/ and /edit.
#
# The app uses three tabs, all joined on interaction_id.
#
# The first sheet holds interactions:
#   timestamp | user_id | interaction_id | question | answer | sources | subqueries
#
# A "feedback" tab, created automatically on first submission:
#   timestamp | user_id | interaction_id | answer_rating | source_rating | comment | question
#
# A "chunks" tab, created automatically on first logged answer, one row per
# retrieved passage with its full text. Separate from the interactions tab
# because the passages are bulky and would make that tab unreadable:
#   timestamp | user_id | interaction_id | position | title | section | url | text
SHEET_ID = "..."

# Service account credentials from Google Cloud, JSON key contents.
# Remember to share the sheet with the client_email below.
[gcp_service_account]
type = "service_account"
project_id = "..."
private_key_id = "..."
private_key = "-----BEGIN PRIVATE KEY-----\nMIIE...\n-----END PRIVATE KEY-----\n"
client_email = "...@....iam.gserviceaccount.com"
client_id = "..."
auth_uri = "https://accounts.google.com/o/oauth2/auth"
token_uri = "https://oauth2.googleapis.com/token"
auth_provider_x509_cert_url = "https://www.googleapis.com/oauth2/v1/certs"
client_x509_cert_url = "..."

# --- Tester access -------------------------------------------------
# One password per person, so access can be revoked individually.
[passwords]
"someone@university.edu" = "generated-password-1"
"another@university.edu" = "generated-password-2"
